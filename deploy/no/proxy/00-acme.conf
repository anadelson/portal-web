# Porta 80 padrão do nó: responde ao desafio do Let's Encrypt de QUALQUER domínio (antes de o domínio entrar no vhost).
# Os domínios dos órgãos entram em portal-orgaos.conf, gerado pelo ativador (porta 80 com redirecionamento e 443 com o certificado).
server {
    listen 80 default_server;
    server_name _;
    location /.well-known/acme-challenge/ { root /var/www/certbot; }
    location / { return 404; }
}
