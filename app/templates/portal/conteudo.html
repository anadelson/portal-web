{% extends 'portal/base.html' %}
{% block titulo %}{{ c.titulo }} — {{ ident.nome }}{% endblock %}
{% block conteudo %}<article><p><small>{{ c.tipo }} · {{ c.secao }} · {{ c.publicar_em|br }}</small>{% if c.exemplo %} <span class="exemplo">exemplo</span>{% endif %}</p><h1>{{ c.titulo }}</h1><p style="font-size:19px;color:#4B5563">{{ c.resumo }}</p><div style="white-space:pre-line">{{ c.texto }}</div></article>{% endblock %}
