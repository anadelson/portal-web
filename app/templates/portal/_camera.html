<div class="cam{{ ' exemplo-cam' if c.exemplo }}"{% if not c.exemplo %} data-cam="/cameras/{{ c.id }}/" data-titulo="Câmera ao vivo: {{ c.nome }}"{% endif %}>
{% if c.exemplo %}<img src="/static/img/exemplo-camera.svg" alt="" loading="lazy">{% else %}<span class="cam-fundo" aria-hidden="true">{{ icone('camera', 44) }}</span>{% endif %}
{% if c.exemplo %}<span class="cam-aviso">Ilustração: aqui aparece a imagem ao vivo</span>{% else %}<button type="button" class="cam-play">{{ icone('play', 18) }}Assistir ao vivo<span class="sr">: {{ c.nome }}</span></button>{% endif %}
{% if not c.exemplo %}<span class="cam-vivo" aria-hidden="true">AO VIVO</span>{% endif %}</div>
<p class="cam-nome"><strong>{{ c.nome }}</strong>{% if c.local %}<small>{{ c.local }}</small>{% endif %}{% if c.exemplo %}<span class="exemplo">exemplo</span>{% endif %}</p>
